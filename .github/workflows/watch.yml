name: rental-watch

on:
  schedule:
    - cron: "17 */3 * * *"   # scrape every 3 h so short-lived listings aren't missed
    - cron: "30 11 * * *"    # 06:30 Toronto (EST) — scrape + send the morning digest (GitHub often runs late)
  workflow_dispatch:
    inputs:
      digest:
        description: "Send the digest now"
        type: boolean
        default: false

concurrency:
  group: rental-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape (and send digest on the morning run)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 11 * * *" ] || [ "${{ inputs.digest }}" = "true" ]; then
            python -m rentals.main --digest
          else
            python -m rentals.main
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name "rental-watch"
          git config user.email "rental-watch@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%RZ)"
          git push
